<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOCX Editor React Component</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap');

      body, html, #root {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #f3f2f2;
        font-family: 'Plus Jakarta Sans', sans-serif;
      }

      /* Modal Overlay styling */
      #upload-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, rgba(241, 245, 249, 0.96) 0%, rgba(219, 228, 238, 0.96) 100%);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        z-index: 9999;
        display: flex;
        justify-content: center;
        align-items: center;
        transition: opacity 0.4s ease, visibility 0.4s ease;
      }

      #upload-overlay.hidden {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
      }

      .upload-container {
        background: rgba(255, 255, 255, 0.85);
        border: 1px solid rgba(255, 255, 255, 0.6);
        border-radius: 24px;
        padding: 40px;
        width: 90%;
        max-width: 500px;
        box-shadow: 0 20px 40px rgba(15, 23, 42, 0.08);
        text-align: center;
        transform: translateY(0);
        transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      }

      #upload-overlay.hidden .upload-container {
        transform: translateY(20px);
      }

      .upload-title {
        font-size: 26px;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 8px 0;
      }

      .upload-subtitle {
        font-size: 14px;
        color: #475569;
        margin: 0 0 30px 0;
      }

      /* Drag & Drop Zone */
      .drop-zone {
        border: 2px dashed #cbd5e1;
        border-radius: 16px;
        padding: 40px 20px;
        background: rgba(248, 250, 252, 0.5);
        cursor: pointer;
        transition: all 0.2s ease;
        position: relative;
      }

      .drop-zone:hover, .drop-zone.dragover {
        border-color: #2563eb;
        background: rgba(37, 99, 235, 0.04);
      }

      .drop-zone.dragover {
        transform: scale(1.02);
      }

      .drop-zone-icon {
        width: 64px;
        height: 64px;
        margin: 0 auto 16px;
        background: #eff6ff;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #2563eb;
        transition: transform 0.3s ease;
      }

      .drop-zone:hover .drop-zone-icon {
        transform: translateY(-4px);
      }

      .drop-zone-icon svg {
        width: 32px;
        height: 32px;
      }

      .drop-zone-text {
        font-size: 16px;
        font-weight: 600;
        color: #1e293b;
        margin-bottom: 4px;
      }

      .drop-zone-hint {
        font-size: 13px;
        color: #64748b;
      }

      /* Floating button for uploading new document */
      #floating-upload-btn {
        position: fixed;
        bottom: 24px;
        right: 24px;
        z-index: 999;
        background: rgba(255, 255, 255, 0.9);
        border: 1px solid rgba(226, 232, 240, 0.8);
        border-radius: 50px;
        padding: 12px 24px;
        font-size: 14px;
        font-weight: 600;
        color: #1e293b;
        box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1), 0 8px 10px -6px rgba(0, 0, 0, 0.1);
        cursor: pointer;
        display: none;
        align-items: center;
        gap: 8px;
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        transition: all 0.2s ease;
      }

      #floating-upload-btn:hover {
        background: #ffffff;
        transform: translateY(-2px);
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        border-color: #cbd5e1;
      }

      #floating-upload-btn svg {
        width: 18px;
        height: 18px;
        stroke-width: 2.5;
      }

      /* Spinner and Status Indicator */
      .status-indicator {
        display: none;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 12px;
        min-height: 110px;
      }

      .spinner {
        width: 36px;
        height: 36px;
        border: 3.5px solid #e2e8f0;
        border-top: 3.5px solid #2563eb;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      .status-text {
        font-size: 14px;
        font-weight: 500;
        color: #475569;
      }
    </style>
    <script type="module" crossorigin src="./assets/index.js?v=ruler_v1"></script>
    <link rel="stylesheet" crossorigin href="./assets/index.css">
  </head>
  <body>
    <div id="root"></div>

    <div id="upload-overlay">
      <div class="upload-container">
        <h1 class="upload-title">Edit DOCX Document</h1>
        <p class="upload-subtitle">Select a Word document (.docx) to view and edit</p>
        <div class="drop-zone" id="drop-zone">
          <div id="drop-zone-content">
            <div class="drop-zone-icon">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <path d="M4 14.899A7 7 0 1 1 15.71 8h1.79a4.5 4.5 0 0 1 2.5 8.242" />
                <path d="M12 12v9" />
                <path d="m9 15 3-3 3 3" />
              </svg>
            </div>
            <div class="drop-zone-text">Drag & drop your DOCX file here</div>
            <div class="drop-zone-hint">or click to browse local files</div>
          </div>
          <div class="status-indicator" id="status-indicator">
            <div class="spinner"></div>
            <div class="status-text" id="status-text">Loading file...</div>
          </div>
        </div>
        <input type="file" id="file-input" accept=".docx" style="display: none;" />
      </div>
    </div>

    <button id="floating-upload-btn">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
        <polyline points="17 8 12 3 7 8" />
        <line x1="12" y1="3" x2="12" y2="15" />
      </svg>
      Upload New DOCX
    </button>

    <script>
      let isEditorReady = false;
      let lastUploadedBase64 = null;
      let pendingLoad = false;

      // Select DOM Elements
      const uploadOverlay = document.getElementById('upload-overlay');
      const fileInput = document.getElementById('file-input');
      const dropZone = document.getElementById('drop-zone');
      const floatingUploadBtn = document.getElementById('floating-upload-btn');
      const statusIndicator = document.getElementById('status-indicator');
      const dropZoneContent = document.getElementById('drop-zone-content');
      const statusText = document.getElementById('status-text');

      window.addEventListener('message', (e) => {
        if (e.data && e.data.type === 'EDITOR_READY') {
          console.log('Editor ready received.');
          isEditorReady = true;
          if (pendingLoad && lastUploadedBase64) {
            sendDocumentToEditor(lastUploadedBase64);
          }
        }
      });

      // Show/hide floating button
      function toggleFloatingButton(show) {
        if (show) {
          floatingUploadBtn.style.display = 'flex';
        } else {
          floatingUploadBtn.style.display = 'none';
        }
      }

      // Trigger file picker on click
      dropZone.addEventListener('click', () => {
        fileInput.click();
      });

      // Handle dropzone drag/drop hover effects
      dropZone.addEventListener('dragover', (e) => {
        e.preventDefault();
        dropZone.classList.add('dragover');
      });

      dropZone.addEventListener('dragleave', () => {
        dropZone.classList.remove('dragover');
      });

      dropZone.addEventListener('drop', (e) => {
        e.preventDefault();
        dropZone.classList.remove('dragover');
        if (e.dataTransfer.files.length > 0) {
          handleFile(e.dataTransfer.files[0]);
        }
      });

      // Handle file selection via picker
      fileInput.addEventListener('change', (e) => {
        if (e.target.files.length > 0) {
          handleFile(e.target.files[0]);
        }
      });

      // Handle floating button click to show upload screen again
      floatingUploadBtn.addEventListener('click', () => {
        fileInput.value = '';
        dropZoneContent.style.display = 'block';
        statusIndicator.style.display = 'none';
        uploadOverlay.classList.remove('hidden');
        toggleFloatingButton(false);
      });

      function handleFile(file) {
        if (!file.name.endsWith('.docx')) {
          alert('Please select a valid .docx file.');
          return;
        }

        // Show spinner inside dropzone
        dropZoneContent.style.display = 'none';
        statusIndicator.style.display = 'flex';
        statusText.innerText = `Loading "${file.name}"...`;

        const reader = new FileReader();
        reader.onload = () => {
          const dataUrl = reader.result;
          const base64 = dataUrl.split(',')[1];
          lastUploadedBase64 = base64;

          if (isEditorReady) {
            sendDocumentToEditor(base64);
          } else {
            pendingLoad = true;
            statusText.innerText = 'Initializing editor, please wait...';
          }
        };
        reader.readAsDataURL(file);
      }

      function sendDocumentToEditor(base64) {
        console.log('Sending LOAD_DOCUMENT to editor...');
        window.postMessage({
          type: 'LOAD_DOCUMENT',
          base64: base64
        }, '*');
        
        // Hide overlay and show floating button
        uploadOverlay.classList.add('hidden');
        toggleFloatingButton(true);
        pendingLoad = false;
      }
    </script>
  </body>
</html>
